name: Deploy to Vercel

on:
  workflow_dispatch:
  push:
    branches: [claude/delivery-app-what3words-b6xgk]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          W3W_API_KEY: ${{ secrets.W3W_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::Missing repo secret VERCEL_TOKEN. Add it under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi
          if [ -z "${W3W_API_KEY:-}" ]; then
            echo "::error::Missing repo secret W3W_API_KEY. Add it under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi
          URL=$(vercel deploy --prod --yes \
            --token "$VERCEL_TOKEN" \
            --build-env W3W_API_KEY="$W3W_API_KEY" \
            --env W3W_API_KEY="$W3W_API_KEY" 2>deploy.err | tail -n1)
          echo "Deployment URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "## ✅ DoorPin deployed"
            echo ""
            echo "**Live:** $URL"
            echo "**Demo (no login):** ${URL}/try"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment live URL on the PR
        if: success() && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const { owner, repo } = context.repo;
            const prs = await github.rest.pulls.list({
              owner, repo, state: 'open',
              head: `${owner}:claude/delivery-app-what3words-b6xgk`,
            });
            const body = [
              '🚀 **Live demo deployed**',
              '',
              `**App:** ${url}`,
              `**Demo (no login):** ${url}/try`,
              '',
              'Open `/try` on your phone — tap *Use my current location* to resolve a what3words address, then *Navigate* to open Google Maps. No account needed.',
            ].join('\n');
            for (const pr of prs.data) {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
